<div class="relative h-screen w-full flex items-center justify-center">
    <img src="assets/images/books_login.avif" alt="Login photo" class="object-cover h-full w-full absolute inset-0 z-0">
    <div class="flex flex-col relative z-10 bg-white shadow-xl shadow-slate-200 bg-opacity-75 h-2/3 rounded-lg p-8 w-96">
        <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="flex flex-col gap-8">
            <h1 class="text-2xl font-semibold text-center color">LOGIN</h1>
            <div class="flex flex-col space-y-1">
                <label for="email">Email</label>
                <input 
                [ngClass]="[
                'rounded-md border p-2 outline-none focus:ring-2 focus:ring-zinc-400',
                (email.invalid && (email.dirty || email.touched)) || badCredentials
                  ? 'border-2 border-red-600'
                  : 'border-zinc-500'
              ]"
                type="email" 
                placeholder="test@example.com" 
                name="email" 
                formControlName="email"
                required />
                <small
                    *ngIf="email.invalid && (email.dirty || email.touched)"
                    class="text-red-700 font-semibold"
                        >
                    <div *ngIf="email.errors?.['required']">Email is required.</div>
                    <div *ngIf="email.errors?.['email']">Email should be valid</div>
                </small>
            </div>
            <div class="flex flex-col space-y-1">
                <label for="password">Password</label>
                <input 
                [ngClass]="[
                'rounded-md border p-2 outline-none focus:ring-2 focus:ring-zinc-400',
                (password.invalid && (password.dirty || password.touched)) || badCredentials
                  ? 'border-2 border-red-600'
                  : 'border-zinc-500'
              ]"
                type="password" 
                name="password" 
                formControlName="password"
                required />
                <small
                *ngIf="password.invalid && (password.dirty || password.touched)"
                class="text-red-700 font-semibold"
              >
                <div *ngIf="password.errors?.['required']">Password is required.</div>
              </small>
            </div>
            <small *ngIf="badCredentials" class="text-red-700">
                <div *ngIf="badCredentials">email or password incorrect.</div>
            </small>
            <div class="flex flex-col space-y-2">
            <button class="border-2 bg-cyan-500 p-2 text-lg font-semibold rounded-lg outline-none border-none hover:shadow-md hover:shadow-cyan-300 transition-all" [disabled]="loginForm.invalid" type="submit">
                Login
            </button>
            <div class="">Not a member? <a routerLink="/signup" class="text-blue-600 font-semibold">Register</a></div>
            </div>
        </form>
    </div>
</div>
