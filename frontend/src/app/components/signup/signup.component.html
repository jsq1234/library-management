<div class="lg:flex lg:h-screen">
  <aside class="lg:basis-2/3">
    <img src="assets/images/books.jpg" alt="books side-bar" class="h-full" />
  </aside>
  <div class="flex flex-col gap-10 border-2 lg:basis-1/3 w-full justify-center">
    <form
      [formGroup]="signUpForm"
      (ngSubmit)="onSubmit()"
      class="flex flex-col gap-8 px-10"
    >
      <h1 class="font-semibold text-2xl w-full m-0 text-center">SIGNUP</h1>
      <div class="flex flex-col space-y-1">
        <label for="name">Name</label>
        <input
          [ngClass]="[
            'rounded-md border p-2 outline-none bg-slate-100 bg-opacity-40 focus:bg-opacity-100',
            name.invalid && (name.dirty || name.touched)
              ? 'border-red-600'
              : 'border-zinc-300'
          ]"
          type="text"
          name="name"
          formControlName="name"
          required
        />
        <small
          *ngIf="name.invalid && (name.dirty || name.touched)"
          class="text-red-500 font-semibold"
        >
          <div *ngIf="name.errors?.['required']">Name is required.</div>
        </small>
      </div>
      <div class="flex flex-col space-y-1">
        <label for="email">Email</label>
        <input
          [ngClass]="[
            'rounded-md border p-2 outline-none focus:ring-1 focus:ring-zinc-400 bg-slate-100 bg-opacity-40 focus:bg-opacity-100',
            email.invalid && (email.dirty || email.touched)
              ? 'border-2 border-red-600'
              : 'border-zinc-300'
          ]"
          type="email"
          placeholder="test@example.com"
          name="email"
          formControlName="email"
          required
        />
        <small
          *ngIf="email.invalid && (email.dirty || email.touched)"
          class="text-red-500 font-semibold"
        >
          <div *ngIf="email.errors?.['required']">Email is required.</div>
          <div *ngIf="email.errors?.['email']">Email should be valid</div>
        </small>
      </div>
      <div class="flex flex-col space-y-1">
        <label for="password">Password</label>
        <input
          [ngClass]="[
            'rounded-md border p-2 outline-none focus:ring-2 focus:ring-zinc-400 bg-slate-100 bg-opacity-40 focus:bg-opacity-100',
            password.invalid && (password.dirty || password.touched)
              ? 'border-2 border-red-600'
              : 'border-zinc-300'
          ]"
          type="password"
          name="password"
          formControlName="password"
          required
        />
        <small
          *ngIf="password.invalid && (password.dirty || password.touched)"
          class="text-red-500 font-semibold"
        >
          <div *ngIf="password.errors?.['required']">Password is required.</div>
        </small>
      </div>
      <small *ngIf="badCredentials" class="text-red-500 font-semibold">
        <div *ngIf="badCredentials">email or password incorrect.</div>
      </small>
      <small *ngIf="userExist" class="text-red-500 font-semibold">
        <div *ngIf="userExist">User already exists.</div>
      </small>
      <div class="flex flex-col space-y-2">
        <button
          class="border-2 flex justify-center text-white items-center h-12 p-2 bg-sky-800 text-lg font-semibold rounded-lg outline-none border-none hover:shadow-lg hover:shadow-sky-300 transition-all"
          [disabled]="signUpForm.invalid"
          type="submit"
        >
        <app-loader *ngIf="isLoading"></app-loader>
        <span *ngIf="!isLoading">Sign Up</span>
        </button>
        <div class="">
          Already registered?
          <a class="text-blue-600 font-semibold" routerLink="/login">Login</a>
        </div>
      </div>
    </form>
  </div>
</div>
